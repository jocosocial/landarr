name: Deploy
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm clean-install
      - run: npm run lint
      - run: npm run build
      # v4 excludes dotfiles, which would silently drop public/.well-known from the site.
      # Keep this on v3 unless a newer version gains an option to include them.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.repository == 'jocosocial/landarr' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
